<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社團巡禮護照</title>
<meta name="description" content="三個社團攤位答題集徽章，集滿換限量小禮；還能玩小遊戲、做紀念小卡。">
<meta name="theme-color" content="#F5F3EE">
<meta property="og:type" content="website">
<meta property="og:title" content="社團巡禮護照｜創友會社團巡禮">
<meta property="og:description" content="三個社團攤位答題集徽章，集滿換限量小禮；還能玩小遊戲、做紀念小卡。">
<meta property="og:url" content="https://nccuembael12.github.io/rally/">
<meta property="og:image" content="https://nccuembael12.github.io/rally/img/og.png">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Caveat:wght@700&display=swap">
<script src="vendor/qrcode.min.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one phone-width column; role bar on top, player uses bottom tabs (護照/關卡/兌換), staff views use top sub-tabs. Passport-and-ink-stamp metaphor. */
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#1D2A2F; --muted:#5F6B70; --line:#E2DDD2; --navy:#1C2B4A; --tri:linear-gradient(90deg,#2E7A4C 0 33.33%,#D9477C 33.33% 66.66%,#F2B705 66.66%);
  --golf:#2E7A4C; --tao:#C93B6E; --dragon:#9A6A00; --gold:#A87A1C;
  --ok:#2E7A4C; --bad:#B3261E; --okbg:#E3F1E7; --badbg:#F8E1DF;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light; /* 永遠淺色，不跟隨系統深色模式 */
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.12em}
.role{font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
main{flex:1;padding-block:4px 110px}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:transparent;padding:10px 16px;min-height:44px;border-radius:999px;font-size:15px}
.subtabs button[aria-selected="true"]{background:linear-gradient(var(--card),var(--card)) padding-box,var(--tri) border-box;border:2px solid transparent;color:var(--ink);font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;padding:12px 0 14px;font-size:12px;min-height:64px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button svg{width:26px;height:26px}
.tabbar button{position:relative}
.tabbar button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--tri)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
h3{font-size:18px;margin:0}
.muted{color:var(--muted)}
.lbl{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.btn{border:3px solid transparent;border-radius:14px;padding:12px 16px;min-height:52px;font-weight:700;background:linear-gradient(var(--card),var(--card)) padding-box,var(--tri) border-box;color:var(--ink);width:100%}
main[data-club="golf"] .btn:not(.ghost){background:#1E5A43;border-color:#1E5A43;color:#fff}
main[data-club="tao"] .btn:not(.ghost){background:#D9477C;border-color:#D9477C;color:#fff}
main[data-club="dragon"] .btn:not(.ghost){background:#F2B705;border-color:#F2B705;color:#3A2400}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ex{font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}

/* passport */
.pass-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.progress{font-family:var(--f-display);font-size:34px;line-height:1}
.progress span{font-size:18px;color:var(--muted)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.slot{aspect-ratio:1;max-width:100%;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);padding:6px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--c);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c);transform:rotate(var(--r,-8deg));gap:2px}
.stamp svg{width:42%;height:auto}
.stamp b{font-family:var(--f-display);font-size:15px;line-height:1.1}
.stamp i{font-style:normal;font-family:var(--f-mono);font-size:9px;opacity:.8}
.stamp.badge{border:0;box-shadow:none;background:none;padding:0;filter:drop-shadow(0 2px 3px rgb(0 0 0 / .18))}
.stamp.badge svg{width:100%;height:100%;display:block}
.stamp.drop{animation:drop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{0%{transform:scale(1.9) rotate(10deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(var(--r,-8deg))}}
.big-stamp{width:150px;margin:6px auto;position:relative}
.splash::before{content:"";position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(circle,var(--c) 0 30%,transparent 31%),radial-gradient(circle at 18% 30%,var(--c) 0 7%,transparent 8%),radial-gradient(circle at 84% 22%,var(--c) 0 5%,transparent 6%),radial-gradient(circle at 76% 82%,var(--c) 0 8%,transparent 9%),radial-gradient(circle at 20% 78%,var(--c) 0 4%,transparent 5%),radial-gradient(circle at 50% 5%,var(--c) 0 4%,transparent 5%);opacity:0;animation:splat .9s ease-out .25s both;z-index:-1}
@keyframes splat{0%{transform:scale(.2);opacity:.55}70%{opacity:.22}100%{transform:scale(1.15);opacity:0}}
.opt.right{animation:glow .6s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgb(46 122 76 / .5)}100%{box-shadow:0 0 0 14px rgb(46 122 76 / 0)}}
.opt.wrong{animation:shake .35s}
@media (prefers-reduced-motion:reduce){.splash::before,.opt.right,.opt.wrong{animation:none}}
.full{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--card))}

/* station cards */
.station{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.ic svg{width:30px}
.ic img,.seal img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ic:has(img){background:#000;overflow:hidden}
.seal:has(img){overflow:hidden;opacity:1}
.stamp.logo{padding:0;overflow:hidden;background:#000}
.stamp.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chip{font-size:14px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.done{background:var(--okbg);color:var(--ok);border-color:transparent;font-weight:700}
.small-btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;min-height:44px;font-size:15px}

/* games */
.game-top{display:flex;align-items:center;gap:10px;background:var(--band,var(--c));color:var(--bandfg,#fff);border-radius:16px;padding:10px 10px 10px 12px;box-shadow:0 8px 18px -12px var(--band,var(--c))}
.game-top .lbl{color:inherit;opacity:.8}
.game-top h3{color:inherit}
.game-top .ic{background:#fff;box-shadow:0 0 0 2px rgb(255 255 255 / .5)}
.game-top .small-btn{background:rgb(255 255 255 / .22);border-color:currentColor;color:inherit}
.game-top .ic{width:40px;height:40px}
.meter{position:relative;height:30px;border-radius:15px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--golf) 35%,transparent);border-left:2px solid var(--golf);border-right:2px solid var(--golf)}
.needle{position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--ink);border-radius:2px}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.hit{background:var(--ok);border-color:var(--ok)}.dot.miss{background:var(--bad);border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px;min-height:64px;font-size:19px;line-height:1.35}
.opt:active{transform:scale(.985);background:var(--paper)}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);font-family:var(--f-display);font-size:28px;font-weight:700}
.tile.ok{background:#F2B705;color:#3A2400;border-color:#F2B705}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{font-family:var(--f-mono);font-size:22px;text-align:center}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.tile.ok small{color:inherit;opacity:.85}
.river{width:100%;max-width:100%;height:auto;display:block;overflow:hidden}
.river .seg{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:translateY(10px) scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.5,.4,1)}
.river .seg.on{opacity:1;transform:none}
.river .wave{animation:wave 2.4s linear infinite}.river .w2{animation-duration:3.2s}
@keyframes wave{to{transform:translateX(-40px)}}
#boat.rock{animation:rock .35s}
@keyframes rock{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
#boat{transform-box:fill-box;transform-origin:center}
#boat.sail{animation:sail 1.2s cubic-bezier(.5,0,.6,1) forwards}
@keyframes sail{30%{transform:translateX(-10px)}100%{transform:translateX(360px)}}
@media (prefers-reduced-motion:reduce){.river .wave,#boat.rock,#boat.sail{animation:none}.river .seg{transition:none}}
.result{text-align:center}
.yard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;border:2px dashed var(--golf);background:color-mix(in srgb,var(--golf) 8%,var(--card))}
.yard .n{font-family:var(--f-display);font-size:46px;line-height:1;color:var(--golf);font-variant-numeric:tabular-nums;min-width:3.2ch}
.yard .n small{font-size:20px;margin-left:4px}
.yard.rolling .n{opacity:.55}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--golf);margin-right:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.vf{aspect-ratio:4/3;width:100%;max-width:100%;border-radius:14px;background:#0F1517;display:grid;place-items:center;position:relative;overflow:hidden}
.vf .box{width:58%;aspect-ratio:1;border:2px solid rgb(255 255 255 / .7);border-radius:12px}
.vf .scanline{position:absolute;left:21%;right:21%;height:2px;background:#5DBB84;top:20%;animation:scan 2s ease-in-out infinite alternate}
.vf .cap{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#C9D2CE;font-size:14px}
@keyframes scan{to{top:78%}}
.vres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;animation:fade .2s both}
.vres.ok{background:var(--ok);color:#fff}.vres.bad{background:var(--bad);color:#fff}
.vres b{font-family:var(--f-display);font-size:32px;line-height:1.2}
.vres span{font-size:17px}.vres small{font-size:14px;opacity:.8;margin-top:6px}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){.pulse,.vf .scanline{animation:none}}
input[type=text],input[type=password],input[type=time],select.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
label{font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* staff */
.qrbox{display:grid;place-items:center;padding:14px;background:#fff;border-radius:12px;width:max-content;max-width:100%;margin:0 auto}
.qrbox img,.qrbox canvas{display:block;max-width:100%;height:auto}
.countdown{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.countdown div{height:100%;background:var(--ink);transition:width 1s linear}
.verdict{border-radius:14px;padding:20px;text-align:center}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict b{font-family:var(--f-display);font-size:28px;display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi .n{font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:88px 1fr 40px;gap:8px;align-items:center;font-size:15px}
.bar .t{height:10px;border-radius:5px;background:var(--paper);overflow:hidden}
.bar .t div{height:100%;background:var(--c)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pd{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line);color:var(--muted);font-size:13px;margin-right:3px}
.pd.on{border:0;background:var(--c);color:#fff;font-weight:700}
.cover{position:relative;overflow:hidden;background:#FFFDF8;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:28px 20px 20px;display:flex;flex-direction:column;gap:6px}
.cover::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--tri)}
.cover-t{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1.1;letter-spacing:.04em}
.seals{display:flex;gap:10px;margin-top:10px}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--paper);display:grid;place-items:center;opacity:.85}
.seal svg{width:24px}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:15px}
.pin-dots{display:flex;gap:14px;justify-content:center;padding-block:6px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pin-dots span.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 0;font-family:var(--f-mono);font-size:20px}
.keypad button.fn{font-family:var(--f-body);font-size:15px;color:var(--muted)}
.stampbtn{border:0;background:none;padding:0;border-radius:50%;display:block;width:100%}
.stampbtn:hover .stamp,.stampbtn:hover .slot{transform:scale(1.04)}
.stamp.locked{filter:grayscale(1);opacity:.45}
.club-hero{display:flex;gap:14px;align-items:center}
.club-hero .stamp{width:96px;flex:none}
.fullm{height:150px;width:auto;flex:none;filter:drop-shadow(0 3px 6px rgb(0 0 0 / .18))}
.clublogo{width:56px;height:56px;border-radius:12px;object-fit:cover}
.facts{display:grid;gap:8px}
.facts div{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:16px}
.facts dt{color:var(--muted);font-size:15px}
[hidden]{display:none!important}
.pp{position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,rgb(46 122 76 / .045) 0 2px,transparent 2px 10px),repeating-linear-gradient(45deg,rgb(217 71 124 / .04) 0 2px,transparent 2px 10px),#FFFDF8;border:1px solid var(--line);box-shadow:0 8px 20px -14px rgb(0 0 0 / .35);color:var(--ink);border-radius:16px;padding:22px 16px 12px;display:flex;flex-direction:column;gap:12px}
.pp::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:var(--tri)}
.pp.done{border-color:var(--gold);background-color:#FFF6DC}
.pp-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}

.pp .meta{font-family:var(--f-mono);font-size:14px;opacity:.7}
.pp .lbl{color:inherit;opacity:.7}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:21px;line-height:1}
.ring b small{font-size:14px;opacity:.7;margin-left:1px}
.pp .stamps{gap:12px;margin:0}
.pp .slot{border-color:#CFC8B8;color:var(--muted);font-size:14px}
.pp .hint{text-align:center;font-size:14px;opacity:.65}
.next-h{font-size:19px;font-weight:700}
.go{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.go .ic{width:48px;height:48px}
.go .arrow{font-size:16px;font-weight:700;color:var(--c);white-space:nowrap}
.go.last{border:2px solid var(--c);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px);box-shadow:0 8px 16px -10px var(--c)}}
@media (prefers-reduced-motion:reduce){.go.last{animation:none}}
.go3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.go3.n2{grid-template-columns:repeat(2,1fr)}
@media (max-height:700px){.ppqr{padding:8px 14px!important}.ppqr .qrbox img,.ppqr .qrbox canvas{width:min(150px,17dvh,38vw)!important}.ppqr .lbl[style]{margin-top:4px!important}}
.go3 .go{grid-template-columns:1fr;justify-items:center;text-align:center;gap:4px;padding:10px 4px}
.go:active{transform:scale(.99)}
.modes{display:flex;flex-direction:column;gap:6px}
.mode{display:flex;gap:8px;font-size:15px;align-items:baseline}
.mode b{white-space:nowrap}
.qbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qbar i{height:6px;border-radius:3px;background:var(--line)}
.qbar i.cur{background:var(--ink)}.qbar i.ok{background:var(--ok)}.qbar i.no{background:var(--bad)}
.fold{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:0;font-size:18px;font-weight:700;text-align:left}
.fold span{font-size:15px;color:var(--muted);font-weight:500}
.foc header,.foc #tabbar{display:none!important}
.foc main{padding-block:12px 16px;display:flex;flex-direction:column}

    seen=[...seen,...pick.map(q=>q.q)];return pick};

function updateCd(){
  const el=$('#cdbar');if(!el)return;

  const nowT=Date.now(),staff=role!=='player';
  if(S.startAt&&nowT<S.startAt){ // 還沒開放
    el.hidden=false;el.className='';el.innerHTML=`<span>${staff?'距離開放':'活動 '+startHM()+' 開放'}</span><span class="mono">${fmtLeft(S.startAt-nowT)}</span>`;return}
  if(!S.endAt){el.hidden=true;return}
  const left=S.endAt-nowT,urgent=left>0&&left<=300000,ended=left<=0;
  let txt;
  if(staff)txt=ended?'活動時間已結束':urgent?'最後 5 分鐘！':'距離活動結束';
  else{const p=me(),n=cnt(p);

    txt=ended?(n===3?'巡禮結束，請到兌換台領禮物':'巡禮時間結束，謝謝參加'):(n===3?'最後衝刺！快去兌換台':`最後衝刺！再 ${3-n} 關領禮物`);

function confetti(colors,n,big){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const c=document.createElement('canvas'),x=c.getContext('2d'),W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);
  c.width=W*dpr;c.height=H*dpr;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40';document.body.appendChild(c);x.scale(dpr,dpr);
  const ox=W/2,oy=big?H*.55:Math.min(H*.32,260);
  const P=Array.from({length:n},()=>{const a=big?(-Math.PI/2+(Math.random()-.5)*2.2):(Math.random()*Math.PI*2),v=(big?9:6)+Math.random()*(big?9:6);
    return{x:big?W*(.2+Math.random()*.6):ox,y:big?H:oy,vx:Math.cos(a)*v*(big?.6:1),vy:Math.sin(a)*v-(big?6:2),r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*5,c:colors[Math.floor(Math.random()*colors.length)]}});
  const t0=performance.now(),dur=big?2600:1600;
  const step=t=>{const e=t-t0;x.clearRect(0,0,W,H);
    for(const p of P){p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-e/dur);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(e<dur)requestAnimationFrame(step);else c.remove()};
  requestAnimationFrame(step);
}

      <button class="btn ghost" onclick="game=null;ptab='passport';render()">${due?'先去領獎（看兌換碼）':'回到護照'}</button></div>`;return}

function gQuiz(k){
  const g=$('#g'),QS=pickQ(k);g.classList.add('qfull');let i=0,right=0,streak=0;
  const res=[];const show=()=>{const q=QS[i];g.innerHTML=`<div class="qbar">${QS.map((_,x)=>`<i class="${x<i?(res[x]?'ok':'no'):x===i?'cur':''}"></i>`).join('')}</div><div class="lbl">第 ${i+1} 題，共 ${QS.length} 題・答對 2 題過關</div>${q.club?`<span class="chip" style="align-self:flex-start;color:${ST[k].c};border-color:currentColor;font-weight:700">社團限定題</span>`:q.fun?'<span class="chip" style="align-self:flex-start;color:var(--gold);border-color:var(--gold)">趣味題</span>':''}<h3 class="q">${q.q}</h3><div class="fbslot" id="fb"></div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div>`;
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;g.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      b.classList.add(j===q.a?'right':'wrong');g.querySelector(`[data-j="${q.a}"]`).classList.add('right');if(j===q.a){right++;streak++}else streak=0;res[i]=j===q.a;
      const next=()=>{i++;if(i<QS.length)show();else{game.perfect=right===QS.length;finish(right>=2,'答對 '+right+' 題。')}};
      if(j===q.a){$('#fb').innerHTML=`<div class="fb ok"><b style="margin:0">${streak>=3?'三題全對，太神了！':streak===2?'連對 2 題！手感正熱':pickOne(['答對了！','漂亮！','太神了！','完全正確！'])}</b></div>`;setTimeout(next,800)}
      else{let gone=false;const go=()=>{if(gone)return;gone=true;clearTimeout(game.qt);next()};
        $('#fb').innerHTML=`<div class="fb bad" id="fbb" role="status"><b>${pickOne(['差一點點～','下一題拿回來！','沒關係，學起來了！'])} 答案是「${q.o[q.a]}」</b>${q.e}<div class="fbt"><i></i></div></div>`;
        $('#fbb').onclick=go;game.qt=setTimeout(go,2000)}})};
  show();
}
/* 達人挑戰：過關後解鎖。整個題庫連續出題（沒看過的先出），答錯就結束，成績＝連對題數 */
function gExpert(k){
  const g=$('#g'),p=me(),seen=(p.seen||{})[k]||[],all=qPool(k),QS=[...shuf(all.filter(q=>!seen.includes(q.q))),...shuf(all.filter(q=>seen.includes(q.q)))];g.classList.add('qfull');let i=0,right=0;
  const end=()=>{const nb=recBest(k+'Q',right,false);game.big=[right,'題',right>=QS.length?'題庫全破！':right>=10?`${ST[k].name}達人！`:right>=5?'高手高手':'再挑戰一次',nb];finish(right>0,`連對 ${right} 題。`)};
  const show=()=>{const q=QS[i];g.innerHTML=`<div class="xbar"><b>${right}</b><span>題連對</span><small>答錯就結束${bestTxt(k+'Q')?'・'+bestTxt(k+'Q'):''}</small></div>${q.club?`<span class="chip" style="align-self:flex-start;color:${ST[k].c};border-color:currentColor;font-weight:700">社團限定題</span>`:q.fun?'<span class="chip" style="align-self:flex-start;color:var(--gold);border-color:var(--gold)">趣味題</span>':''}<h3 class="q">${q.q}</h3><div class="fbslot" id="fb"></div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div>`;
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;g.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      b.classList.add(j===q.a?'right':'wrong');g.querySelector(`[data-j="${q.a}"]`).classList.add('right');
      if(j===q.a){right++;i++;$('#fb').innerHTML=`<div class="fb ok"><b style="margin:0">${right%5===0?`連對 ${right} 題！`:pickOne(['答對了！','漂亮！','繼續！','完全正確！'])}</b></div>`;game.qt=setTimeout(()=>{if(game&&game.phase==='play')i<QS.length?show():end()},700)}
      else{let gone=false;const go=()=>{if(gone)return;gone=true;clearTimeout(game.qt);end()};
        $('#fb').innerHTML=`<div class="fb bad" id="fbb" role="status"><b>答案是「${q.o[q.a]}」</b>${q.e}<div class="fbt"><i></i></div></div>`;
        $('#fbb').onclick=go;game.qt=setTimeout(go,2000)}})};
  show();
}
let AC=null;
function drum(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;

function puttCard(){
  const box=$('#putt'),p=me();
  if(game.puttDone){
    box.innerHTML=`<div class="lbl">推桿加碼結果</div><h2>${p.putt.dist} 碼：${p.putt.ok?'推進了！':'差一點，沒進'}</h2>
      <button class="btn" style="background:var(--golf)" id="again">再推一次（重新隨機距離）</button>`;
    $('#again').onclick=()=>{Object.assign(game,{puttDone:false,dist:null,token:null,pinMode:false});renderGame()};return;
  }
  if(!game.dist)game.dist=randYard();
  const d=game.dist;
  if(!game.token){game.token='C'+Math.random().toString(36).slice(2,8).toUpperCase();S.pending[game.token]={pid:S.me,k:game.k,dist:d,t:now()};save()}
  const tk=game.token;
  const done=r=>{delete S.confirm[tk];delete S.pending[tk];p.putt={dist:d,ok:r==='pass',t:now()};save();clearTick();game.puttDone=true;game.token=null;renderGame();toast(r==='pass'?`${d} 碼推進了！`:'已記錄')};
  const head=`<div class="lbl" style="color:var(--golf)">加碼挑戰：實體推桿（自由參加，不影響徽章）</div>
    <div class="yard"><div><div class="lbl">你的推桿距離</div><div class="n">${d}<small>碼</small></div></div><span class="chip">系統隨機指定</span></div>
    <div style="font-size:17px">站到 <b>${d} 碼</b>標示線推 1 球，推完把手機給關主確認。</div>`;
  if(game.pinMode){
    box.innerHTML=`${head}<label for="pp">關主 PIN<input type="password" id="pp" class="mono" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 位數"></label><div id="pe"></div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" id="py">進了</button><button class="btn ghost" id="pn">沒進</button></div>
     <button class="small-btn" id="pback">改回掃碼確認</button><div class="muted" style="font-size:14px">原型 PIN：${pinOf(game.k)}</div>`;
    const chk=()=>{if($('#pp').value===pinOf(game.k))return true;$('#pe').innerHTML='<div class="err">PIN 不正確，請關主重新輸入</div>';$('#pp').value='';$('#pp').focus();return false};
    $('#py').onclick=()=>{if(chk())done('pass')};$('#pn').onclick=()=>{if(chk())done('fail')};
    $('#pback').onclick=()=>{game.pinMode=false;renderGame()};return;
  }
  box.innerHTML=`${head}<div class="result stack"><div class="lbl">關主確認碼</div><div class="qrbox" id="cq"></div><div class="mono" style="font-size:15px">${tk}</div>
     <div style="font-size:15px"><span class="pulse"></span>等待關主掃描…</div></div>
    <div class="chips" style="justify-content:center"><button class="small-btn" id="tohost">原型：切到關主手機掃描</button><button class="small-btn" id="topin">改用關主 PIN</button></div>
    <div class="muted" style="font-size:14px;text-align:center">不想推的話直接回護照就好</div>`;
  qr($('#cq'),'https://rally.example/c?t='+tk,150);
  $('#tohost').onclick=()=>{S.hostStation=game.k;stab.host='scan';stab.hostSel=tk;stab.hostMsg=null;save();role='host';$('#role').value='host';render()};
  $('#topin').onclick=()=>{game.pinMode=true;renderGame()};
  const poll=()=>{const r=S.confirm[tk];if(r)done(r)};
  game.iv=setInterval(poll,800);poll();
}

const COHORTS=[...Array.from({length:14},(_,i)=>'創'+(i+1)),'師長','班媽/輔導員','嘉賓'];
/* 會員名冊：有名冊的屆別才比對，沒有名冊的屆別直接放行；同屆別同姓名只能領一本 */
const normName=n=>String(n||'').replace('（你）','').replace(/\s+/g,'').replace(/臺/g,'台');
const roster=()=>S.roster||(S.roster=[]);
const rosterHas=c=>roster().some(r=>r.c===c);
const inRoster=(c,n)=>roster().some(r=>r.c===c&&normName(r.n)===normName(n));
const dupPlayer=(c,n)=>Object.values(S.players).some(p=>p.cohort===c&&normName(p.name)===normName(n));
const normCohort=c=>{c=String(c||'').trim();if(/^\d+$/.test(c))c='創'+(+c);if(/^創0\d$/.test(c))c='創'+(+c.slice(1));if(c==='班媽'||c==='輔導員')c='班媽/輔導員';return COHORTS.includes(c)?c:''};
function addRoster(c,n,manual){c=normCohort(c);n=String(n||'').trim();if(!c||!n)return 'bad';if(inRoster(c,n))return 'dup';roster().push({c,n,m:manual?1:0});return 'ok'}
function importRoster(text){let ok=0,dup=0,bad=0;String(text||'').split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;const a=l.split(/[\t,，、\s]+/).filter(Boolean);if(a.length<2||/屆別|姓名/.test(l)){if(!/屆別|姓名/.test(l))bad++;return}const r=addRoster(a[0],a.slice(1).join(''));r==='ok'?ok++:r==='dup'?dup++:bad++});save();return{ok,dup,bad}}
const SAMPLE_ROSTER='屆別\t姓名\n創12\t王大明\n創12\t林美玲\n創12\t陳志豪\n創12\t張雅婷\n創13\t李建宏\n創13\t黃淑芬\n創13\t吳宗翰\n創14\t志明\n創14\t劉怡君\n創14\t蔡承恩';
function passHTML(id){return `<div class="stack" style="gap:8px"><div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px"><label for="${id}c">屆別<select class="f" id="${id}c">${cohortOpts('')}</select></label><label for="${id}n">姓名<input type="text" id="${id}n"></label></div><button class="btn ghost" id="${id}b">放行這位參加者</button><div class="muted" style="font-size:14px">名冊比對不到、但確認是會員時使用。放行後請他重新按一次「領取護照」。</div></div>`}
function bindPass(id){const b=$('#'+id+'b');if(!b)return;b.onclick=()=>{const c=$('#'+id+'c').value,n=$('#'+id+'n').value.trim();if(!c){toast('請選擇屆別');$('#'+id+'c').focus();return}if(!n){toast('請填姓名');$('#'+id+'n').focus();return}
  if(dupPlayer(c,n)){toast(`${c} ${n} 已經領過護照，請用「找回我的護照」`);return}
  const r=addRoster(c,n,1);save();toast(r==='dup'?`${c} ${n} 已在名冊裡，可以直接領護照`:`已放行 ${c} ${n}`);render()}}
const cohortOpts=sel=>'<option value="">請選擇屆別</option>'+COHORTS.map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('');

function heatCard(k){
  const per=KEYS.map(x=>[x,passCount(x)]).sort((a,b)=>b[1]-a[1]),rank=per.findIndex(x=>x[0]===k)+1,mine=passCount(k),max=per[0][1]||1;
  const step=mine<50?10:50,m=(Math.floor(mine/step)+1)*step;
  const line=rank===1?`人氣第 1 名！領先${ST[per[1][0]].name} ${mine-per[1][1]} 人`:`人氣第 ${rank} 名，只差${ST[per[rank-2][0]].name} ${per[rank-2][1]-mine} 人，衝一波！`;
  return `<div class="panel stack" style="gap:10px"><div class="who"><div><div class="lbl">本關過關</div><div class="kpi"><span class="n">${mine}</span> 人</div></div><span class="chip" style="color:var(--gold);border-color:var(--gold)">再 ${m-mine} 人破 ${m}</span></div>
   <div style="font-weight:700">${line}</div>
   ${per.map(([x,v],i)=>`<div class="bar" style="--c:${BADGE[x].bg};grid-template-columns:122px 1fr 40px"><span style="${x===k?'font-weight:700':''}">${i+1}. ${ST[x].name}</span><div class="t"><div style="width:${v/max*100}%"></div></div><span class="mono">${v}</span></div>`).join('')}</div>`;
}

function fitCard(){
  const els=[...document.querySelectorAll('.cardcv')],w=document.querySelector('.cwrap'),tb=document.querySelector('.tabbar');if(!els.length||!w||!tb)return;
  els.forEach(e=>{e.style.height='';e.style.width='';e.style.maxHeight=''});w.parentElement.style.marginBottom='';
  const cv=els.find(e=>!e.hidden)||els[0],r=cv.getBoundingClientRect();if(!r.height)return;
  const sw=document.getElementById('swbar'),lim=Math.min(tb.getBoundingClientRect().top,sw&&!sw.hidden&&sw.getBoundingClientRect().height?sw.getBoundingClientRect().top:1e9);
  const avail=lim-10-w.parentElement.getBoundingClientRect().bottom;if(avail<4)return;
  const asp=CW/CH,h=Math.min(r.height+avail,w.clientWidth/asp);if(h<=r.height+1)return;

function verify(code){
  const d=(code.match(/\d+/)||[''])[0];
  if(!d)return{ok:false,h:'請輸入兌換號碼',m:'號碼在參加者「我的護照」頁的 QR 下方。'};
  const id=FIRE?d.padStart(4,'0'):'P'+d.padStart(3,'0'),p=S.players[id];
  if(!p)return{ok:false,h:`查無 ${d.padStart(3,'0')} 號`,m:'請再確認一次參加者畫面上的號碼。'};
  if(p.redeemed)return{ok:false,h:'已經兌換過',m:`${p.name} 已於 ${p.redeemed} 領取，每人限領一次。`};
  const n=cnt(p);if(n<3)return{ok:false,h:`只集了 ${n} 章`,m:`還差：${KEYS.filter(k=>!p.badges[k]).map(k=>ST[k].name).join('、')}`};
  if(giftTotal()-redCount()<=0)return{ok:false,h:'禮物已發完',m:'請通知主辦，或到管理後台調整獎品數量。'};
  p.redeemed=now();S.redeemLog.unshift({no:rno(id),name:p.name,t:p.redeemed});return{ok:true,h:'兌換成功 ✓',m:`${rno(id)} 號 ${p.name}（${p.cohort||''}）・第 ${redCount()} 位領獎`,lucky:p.lucky?p.rank:0,say:p.lucky?`第 ${p.rank} 位幸運兒，請加發加碼禮！`:pickOne(['恭喜集滿三章！','三關全破，太厲害了！','禮物請收好，社團見！','歡迎常來社團玩！'])};
}

/* ================= 正式版後端：Firebase（Firestore） =================
   只有在網站版（config.js 設定 RALLY_MODE='fire'）才會啟用；預覽版維持單機原型。
   資料分工：自己的護照即時同步；排行榜讀工作人員手機定時發布的快照；兌換台／後台／幹部的手機讀全部護照。 */
const SYNCK=['badges','best','perfect','dragonT','fullAt','pre'];           // 護照裡會同步到伺服器的欄位（entered 由 fireEnter 單獨寫）
const SETK=['startAt','endAt','startHM','endHM','giftTotal','lucky','regOn','screenOn','links','customQ']; // 全場共用的活動設定
const mkCode=()=>String(Math.floor(Math.random()*10000)).padStart(4,'0'); // 挑戰碼：4 位數字
const okCode=v=>/^\d{4}$/.test(v||'');
const FD=(...p)=>FBS.doc(fx.db,...p);
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);

const meSync=p=>{const o={};SYNCK.forEach(k=>{if(p[k]!==undefined)o[k]=p[k]});return o};
const setPick=()=>{const o={};SETK.forEach(k=>{if(S[k]!==undefined&&S[k]!==null)o[k]=S[k]});return JSON.stringify(o)};
const hmOf=ms=>ms?new Date(ms).toTimeString().slice(0,5):'';
const staffHas=r=>staffList().some(e=>e.r===r);

function fireBoot(){ // 同步執行：決定第一個畫面

  if(s&&KEYS.includes(s)&&t){fx.pend={k:s,t:String(t)};ob.station=s;try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}else ob.station='pre';
  ob.mode='new';stab.manual=true; // 兌換台：正式版預設就開著號碼輸入框

async function fireInit(){
  try{
    if(!fx.app){fx.app=FBS.initializeApp(window.RALLY_FB);fx.auth=FBS.getAuth(fx.app);
      try{fx.db=FBS.initializeFirestore(fx.app,{localCache:FBS.persistentLocalCache({tabManager:FBS.persistentMultipleTabManager()})})}catch(e){fx.db=FBS.getFirestore(fx.app)}}
    await new Promise(res=>{const un=FBS.onAuthStateChanged(fx.auth,u=>{un();res(u)})});
    if(!fx.auth.currentUser)await FBS.signInAnonymously(fx.auth);
    fx.uid=fx.auth.currentUser.uid;fx.ready=true;
  }catch(e){console.error('[rally] 連線失敗',e);if(!fx.warned){fx.warned=1;toast('連不上伺服器，請檢查網路')}setTimeout(fireInit,5000);return}
  // 活動設定：全場共用，管理後台改了大家都會收到
  FBS.onSnapshot(FD('meta','config'),s=>{fx.metaLoaded=true;if(!s.exists()){fx.setJ=null;return}
    const j=s.data().j||'{}';if(j===fx.setJ)return;fx.setJ=j;let c={};try{c=JSON.parse(j)}catch(e){}
    SETK.forEach(k=>{if(k in c)S[k]=c[k];else delete S[k]});localSave();softRender()},e=>console.warn('[rally] meta',e));
  if(!S.me){try{const qs=await FBS.getDocs(FBS.query(FBS.collection(fx.db,'players'),FBS.where('owner','==',fx.uid)));if(qs.size&&role==='onboard'&&!S.me)await fireAdopt(qs.docs[0].id)}catch(e){console.warn('[rally] adopt',e)}}
  fireMe();await fireStaffStart();firePub(true);if(staffList().length)render();
  if(fx.pend&&S.me&&S.players[S.me]){const e=fx.pend;fx.pend=null;fireEnter(e.k,e.t)}

}
/* ---------- 自己的護照 ---------- */
function fireMe(){
  if(fx.unMe){fx.unMe();fx.unMe=null}
  const pid=S.me;if(!pid||!fx.ready)return;
  const gone=msg=>{delete S.players[pid];if(S.me===pid){S.me=null;S.joined=0}fx.meJ=null;localSave();if(fx.unMe){fx.unMe();fx.unMe=null}if(['player'].includes(role)){role='onboard';game=null;render()}toast(msg)};
  fx.unMe=FBS.onSnapshot(FD('players',pid),s=>{
    if(!s.exists()){if(s.metadata.fromCache)return;return gone('這本護照已被清除，請重新領取')}
    const d=s.data(),cur=S.players[pid]||(S.players[pid]={});
    if(d.owner&&d.owner!==fx.uid)return gone('這本護照已在另一支手機開啟');
    if(s.metadata.hasPendingWrites)d.entered=cur.entered||{};   // 挑戰碼還沒被伺服器確認前，不算進攤位
    Object.keys(cur).forEach(k=>{if(!(k in d)&&!['rec','seen','rank','lucky'].includes(k))delete cur[k]});
    Object.assign(cur,d);fx.meJ=JSON.stringify(meSync(cur));fireDerive();localSave();softRender();
  },e=>{if(e.code==='permission-denied')gone('這本護照已在另一支手機開啟');else console.warn('[rally] me',e)});

function fireFail(e,what){console.warn('[rally] 同步失敗',what,e);
  if(e&&e.code==='permission-denied'){toast('有一筆資料沒有同步成功，已還原');if(what==='me'&&S.me)FBS.getDocFromServer(FD('players',S.me)).catch(()=>{})}}
/* ---------- 每次 save() 之後：把本機的變動送上去 ---------- */
function fireSync(){
  if(!fx.ready)return;
  const pid=S.me,p=pid&&S.players[pid];
  if(p&&fx.meJ!==null&&fx.meJ!==undefined){const cur=meSync(p),js=JSON.stringify(cur);
    if(js!==fx.meJ){const prev=JSON.parse(fx.meJ),upd={};SYNCK.forEach(k=>{if(cur[k]!==undefined&&JSON.stringify(cur[k])!==JSON.stringify(prev[k]))upd[k]=cur[k]});
      fx.meJ=js;if(Object.keys(upd).length)FBS.updateDoc(FD('players',pid),upd).catch(e=>fireFail(e,'me'))}}
  // 「我有興趣加入」：自己新增的送上去
  (S.leads||[]).forEach(l=>{if(l.pid&&l.pid===pid&&!l.fid&&!l.ex&&!l.sending){l.sending=1;
    FBS.addDoc(FBS.collection(fx.db,'leads'),{uid:fx.uid,pid,club:l.club,cohort:l.cohort||'',name:l.name||'',line:l.line||'',t:l.t||now(),st:l.st||'todo',at:Date.now()})
      .then(r=>{l.fid=r.id;delete l.sending;localSave()}).catch(e=>{delete l.sending;fireFail(e,'lead')})}});
  if(fx.full){
    // 兌換台：本機剛標成已兌換的護照，送上去；被擋下就還原並提示
    Object.entries(S.players).forEach(([id,q])=>{if(q.redeemed&&fx.red[id]===null){fx.red[id]=q.redeemed;
      FBS.updateDoc(FD('players',id),{redeemed:q.redeemed,redeemedBy:fx.uid}).catch(e=>{q.redeemed=null;fx.red[id]=null;fireDerive();
        lastVerdict={ok:false,h:'兌換沒有成功',m:e&&e.code==='permission-denied'?'這本護照可能剛被另一台兌換，或資料還沒同步，請再確認一次。':'網路不穩，請再試一次。'};
        clearTimeout(verdictTimer);verdictTimer=setTimeout(()=>{lastVerdict=null;if(role==='redeem')render()},5000);if(role==='redeem')render()})}});
    // 社團幹部：聯繫狀態
    (S.leads||[]).forEach(l=>{if(l.fid&&fx.leadSt[l.fid]!==undefined&&fx.leadSt[l.fid]!==l.st){fx.leadSt[l.fid]=l.st;FBS.updateDoc(FD('leads',l.fid),{st:l.st}).catch(e=>fireFail(e,'leadSt'))}});
  }
  if(staffHas('admin')&&fx.metaLoaded){const js=setPick();if(js!==fx.setJ){fx.setJ=js;FBS.setDoc(FD('meta','config'),{j:js,t:Date.now()}).catch(e=>fireFail(e,'meta'))}
    if(fx.pinsJ&&S.pins){const pj=JSON.stringify(Object.assign({},DEF_PINS,S.pins));if(pj!==fx.pinsJ){fx.pinsJ=pj;FBS.setDoc(FD('secret','pins'),JSON.parse(pj)).catch(e=>fireFail(e,'pins'))}}}
}
/* ---------- 排名、戰報：由手上的護照資料推算 ---------- */
function fireDerive(){
  const full=Object.entries(S.players).filter(([i,p])=>p&&p.badges&&cnt(p)===3).sort((a,b)=>(a[1].fullAt||9e15)-(b[1].fullAt||9e15)),L=luckyList();
  Object.values(S.players).forEach(p=>{if(p){delete p.rank;delete p.lucky}});
  full.forEach(([i,p],n)=>{p.rank=n+1;p.lucky=L.includes(n+1)});
  S.fullLog=full.slice().reverse().slice(0,30).map(([i,p])=>({n:p.name,c:p.cohort||'',t:hmOf(p.fullAt)||p.badges.dragon||'',r:p.rank,lucky:p.lucky}));
  S.redeemLog=Object.entries(S.players).filter(([i,p])=>p&&p.redeemed).sort((a,b)=>String(b[1].redeemed).localeCompare(String(a[1].redeemed))).slice(0,10).map(([i,p])=>({no:rno(i),name:p.name,t:p.redeemed}));
}
/* ---------- 排行榜快照（參加者、關主用） ---------- */
async function firePub(force){

function firePublish(){

function fireGateTop(k){ // 一次備好後面兩小時的碼；剩不到半小時就補，順便清掉過期的
  const c=fx.gate[k];if(!c||!fx.ready)return;const s=Math.floor(Date.now()/30000);let last=s-1;while(okCode(c[String(last+1)]))last++;
  fx.gateW=fx.gateW||{};if(last-s>=60||Date.now()-(fx.gateW[k]||0)<8000)return;fx.gateW[k]=Date.now();
  const add={};for(let i=s-1;i<=s+240;i++)if(!okCode(c[String(i)]))add[String(i)]=mkCode(); // 舊格式（英數）的碼一併換成數字
  const old=Object.keys(c).filter(x=>+x<s-6).slice(0,300);
  FBS.setDoc(FD('gate',k),{codes:add},{merge:true}).then(()=>{if(old.length){const u={};old.forEach(x=>u['codes.'+x]=FBS.deleteField());return FBS.updateDoc(FD('gate',k),u)}}).catch(e=>console.warn('[rally] gate write',e));

function fireBusy(){ob.err='';const b=$('#obtn')||$('#rbtn');if(b){b.disabled=true;b.textContent='處理中…'}}
async function fireJoin(cohort,name,pre){
  const fail=msg=>{ob.busy=0;ob.err=msg;if(role==='onboard')rOnboard()};
  if(!fx.ready)return fail('連線中，請稍候幾秒再按一次');
  fireBusy();
  const ck=ckOf(cohort,name),rec=String(Math.floor(1000+Math.random()*9000));
  try{
    const c=await withTimeout(FBS.getDoc(FD('claims',ck)),9000);
    if(c.exists()){if(await fireAdopt(c.data().pid))return;return fail(`${cohort} ${name} 已經領過護照了。換了手機或瀏覽器？請按下方「找回我的護照」。`)}
    let pid=null;
    for(let i=0;i<6&&!pid;i++){const id=String(Math.floor(1000+Math.random()*9000)),b=FBS.writeBatch(fx.db);
      b.set(FD('priv',id),{owner:fx.uid,rec});b.set(FD('players',id),{owner:fx.uid,name,cohort,ck,badges:{},entered:{},redeemed:null,pre:pre?1:0,at:Date.now()});b.set(FD('claims',ck),{pid:id});
      try{await withTimeout(b.commit(),9000);pid=id}catch(e){if(e.code!=='permission-denied')throw e}}
    if(!pid)return fail('領取沒有成功，請再按一次；還是不行請找現場關主協助。');
    S.players[pid]={owner:fx.uid,name,cohort,ck,rec,badges:{},entered:{},redeemed:null,pre:pre?1:0};S.me=pid;S.joined=1;fx.meJ=JSON.stringify(meSync(S.players[pid]));localSave();
    ob.busy=0;ob.err='';role='player';game=null;ptab='passport';fireMe();render();toast('護照已領取，找回碼 '+rec);
    if(fx.pend){const e=fx.pend;fx.pend=null;fireEnter(e.k,e.t)}
  }catch(e){console.warn('[rally] join',e);fail('網路不穩，請再試一次')}
}
// 伺服器上已經有屬於這支手機的護照：直接接回（不用找回碼）
async function fireAdopt(pid){
  try{const ps=await FBS.getDoc(FD('players',pid));if(!ps.exists()||ps.data().owner!==fx.uid)return false;
    let rec='';try{const pv=await FBS.getDoc(FD('priv',pid));rec=(pv.exists()&&pv.data().rec)||''}catch(e){}
    S.players[pid]=Object.assign({},ps.data(),{rec});S.me=pid;S.joined=1;fx.meJ=JSON.stringify(meSync(S.players[pid]));fireDerive();localSave();
    ob.busy=0;ob.err='';role='player';game=null;ptab='passport';fireMe();render();toast('已接回你的護照');
    if(fx.pend){const e=fx.pend;fx.pend=null;fireEnter(e.k,e.t)}return true}catch(e){return false}
}
async function fireRecover(cohort,name,rec){
  const fail=msg=>{ob.busy=0;ob.err=msg;if(role==='onboard')rOnboard()};
  if(!fx.ready)return fail('連線中，請稍候幾秒再按一次');
  fireBusy();
  try{
    const c=await withTimeout(FBS.getDoc(FD('claims',ckOf(cohort,name))),9000);
    if(!c.exists())return fail('找不到這個屆別和姓名的護照，請確認用字和當初填的一樣。');
    const pid=c.data().pid,b=FBS.writeBatch(fx.db);b.update(FD('priv',pid),{owner:fx.uid,proof:rec});b.update(FD('players',pid),{owner:fx.uid});
    try{await withTimeout(b.commit(),9000)}catch(e){if(e.code==='permission-denied')return fail('找回碼不符，請再確認一次');throw e}
    const s=await FBS.getDocFromServer(FD('players',pid));
    S.players[pid]=Object.assign({},s.data(),{rec});S.me=pid;S.joined=1;fx.meJ=JSON.stringify(meSync(S.players[pid]));fireDerive();localSave();
    ob.busy=0;ob.err='';ob.mode='new';role='player';game=null;ptab='passport';fireMe();render();toast('歡迎回來，'+name);
    if(fx.pend){const e=fx.pend;fx.pend=null;fireEnter(e.k,e.t)}
  }catch(e){console.warn('[rally] recover',e);fail('網路不穩，請再試一次')}
}
/* ---------- 管理後台：清除全部資料（測試完歸零用） ---------- */
async function fireWipe(){
  const refs=[],ps=await FBS.getDocs(FBS.collection(fx.db,'players')),ls=await FBS.getDocs(FBS.collection(fx.db,'leads'));
  ps.forEach(d=>{refs.push(FD('players',d.id),FD('priv',d.id));const ck=d.data().ck;if(ck)refs.push(FD('claims',ck))});ls.forEach(d=>refs.push(d.ref));refs.push(FD('pub','board'));
  for(let i=0;i<refs.length;i+=300){const b=FBS.writeBatch(fx.db);refs.slice(i,i+300).forEach(r=>b.delete(r));await b.commit()}
  return ps.size;
}
/* ---------- 伺服器來了新資料：畫面安全時才重畫（不打斷輸入與遊戲） ---------- */
let srT=null;
function softRender(){clearTimeout(srT);srT=setTimeout(()=>{
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='role')return;
  if(!$('#modal').hidden)return;
  if(role==='player'){if(game||!['passport','stations','battle'].includes(ptab))return}
  else if(role==='admin'){if((stab.admin||'overview')!=='overview')return}
  else if(role==='onboard'||role==='staffLogin')return;
  else if(role==='redeem'&&lastVerdict)return;
  render()},250)}

if(FIRE)fireBoot();
// 分享連結加 #join：這支手機還沒領過護照就直接進首次領取頁
function joinGate(){if(location.hash==='#join'&&!S.joined){role='onboard';ob.station='pre';ob.mode='new';$('#role').value='onboard'}}
joinGate();addEventListener('hashchange',()=>{joinGate();render()});
render();
</script>
